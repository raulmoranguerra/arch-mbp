# No lock screen: sleeping ends the session, so you always land on the tuigreet login.
# Screen off at 5 min, suspend at 10 min (lid close suspends too).
general {
    before_sleep_cmd = hyprctl dispatch exit
    after_sleep_cmd = hyprctl dispatch dpms on
}
listener {
    timeout = 300
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
listener {
    timeout = 600
    on-timeout = systemctl suspend
}
