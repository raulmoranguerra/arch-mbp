# Hyprland, kept lean for a 2015 MacBook Pro: no animations, blur, shadows or rounding.
# Per-machine bits (monitor scale, keyboard layout) live in host.conf, the look in theme.conf.
source = ~/.config/hypr/host.conf
source = ~/.config/hypr/theme.conf

# Option (Alt) is the mod key. Cmd and Ctrl are swapped in kb_options so Cmd+C/V/T work like macOS.
$mod = ALT
$term = foot
$menu = fuzzel

input {
    kb_options = caps:escape,ctrl:swap_lwin_lctl,ctrl:swap_rwin_rctl
    repeat_delay = 300
    repeat_rate = 40
    follow_mouse = 2
    sensitivity = 0.3
    accel_profile = adaptive
    touchpad {
        natural_scroll = true
        tap-to-click = true
        clickfinger_behavior = true
        disable_while_typing = true
        middle_button_emulation = true
    }
}

decoration {
    rounding = 0
    blur {
        enabled = false
    }
    shadow {
        enabled = false
    }
}

animations {
    enabled = false
}

general {
    layout = dwindle
    resize_on_border = true
}

dwindle {
    preserve_split = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    vfr = true
}

xwayland {
    force_zero_scaling = true
}

# Autostart
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = mako
exec-once = waybar
exec-once = hyprpaper
exec-once = hypridle

# Core
bind = $mod, Return, exec, $term
bind = $mod, D, exec, $menu
bind = $mod, B, exec, firefox
bind = $mod SHIFT, Q, killactive
bind = $mod SHIFT, C, exec, hyprctl reload
bind = $mod, Escape, exec, loginctl lock-session
bind = $mod SHIFT, E, exec, ~/.local/bin/powermenu
bind = $mod, F, fullscreen, 0
bind = $mod SHIFT, Space, togglefloating
bind = $mod, E, layoutmsg, togglesplit
bind = $mod, W, togglegroup
bind = $mod, Tab, changegroupactive, f

# Focus and move
bind = $mod, H, movefocus, l
bind = $mod, J, movefocus, d
bind = $mod, K, movefocus, u
bind = $mod, L, movefocus, r
bind = $mod, Left, movefocus, l
bind = $mod, Down, movefocus, d
bind = $mod, Up, movefocus, u
bind = $mod, Right, movefocus, r
bind = $mod SHIFT, H, movewindow, l
bind = $mod SHIFT, J, movewindow, d
bind = $mod SHIFT, K, movewindow, u
bind = $mod SHIFT, L, movewindow, r
bind = $mod SHIFT, Left, movewindow, l
bind = $mod SHIFT, Down, movewindow, d
bind = $mod SHIFT, Up, movewindow, u
bind = $mod SHIFT, Right, movewindow, r

# Workspaces
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod, slash, workspace, previous
bind = $mod, period, workspace, e+1
bind = $mod, comma, workspace, e-1
bind = $mod, minus, movetoworkspace, special
bind = $mod, equal, togglespecialworkspace

# Mouse: Option + drag moves, Option + right-drag resizes
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Resize mode
bind = $mod, R, submap, resize
submap = resize
binde = , H, resizeactive, -20 0
binde = , J, resizeactive, 0 20
binde = , K, resizeactive, 0 -20
binde = , L, resizeactive, 20 0
bind = , Return, submap, reset
bind = , Escape, submap, reset
submap = reset

# Media, brightness (Apple keyboard keys), screenshots
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
bindel = , XF86KbdBrightnessUp, exec, brightnessctl -d smc::kbd_backlight set 10%+
bindel = , XF86KbdBrightnessDown, exec, brightnessctl -d smc::kbd_backlight set 10%-
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous
bind = , Print, exec, ~/.local/bin/shot
bind = $mod, Print, exec, ~/.local/bin/shot save
