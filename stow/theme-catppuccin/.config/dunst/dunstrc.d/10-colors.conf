[global]
    frame_color = "#45475a"
    separator_color = "#45475a"
[urgency_low]
    background = "#11111b"
    foreground = "#cdd6f4"
    highlight = "#cba6f7"
    timeout = 4
[urgency_normal]
    background = "#11111b"
    foreground = "#cdd6f4"
    highlight = "#cba6f7"
    timeout = 6
[urgency_critical]
    background = "#11111b"
    foreground = "#cdd6f4"
    frame_color = "#f38ba8"
    highlight = "#f38ba8"
    timeout = 0
