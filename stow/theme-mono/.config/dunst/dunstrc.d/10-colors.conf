[global]
    frame_color = "#3a3a3a"
    separator_color = "#3a3a3a"
[urgency_low]
    background = "#000000"
    foreground = "#f2f2f2"
    highlight = "#ffffff"
    timeout = 4
[urgency_normal]
    background = "#000000"
    foreground = "#f2f2f2"
    highlight = "#ffffff"
    timeout = 6
[urgency_critical]
    background = "#000000"
    foreground = "#ffffff"
    frame_color = "#ffffff"
    highlight = "#ffffff"
    timeout = 0
