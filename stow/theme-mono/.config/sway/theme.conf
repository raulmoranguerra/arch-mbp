# Black and white theme for sway
set $bg    #000000
set $bg1   #111111
set $line  #262626
set $mid   #3a3a3a
set $gray  #808080
set $fg    #f2f2f2
set $white #ffffff

font pango:JetBrainsMono Nerd Font 10

# Wallpaper: drawn once by sway, no daemon. Others in ~/.config/wallpapers: stars-rocket.png, shuttle.png, night-station.jpg, storm-rail.jpg, mountain.jpg.
# For no image at all use: output * bg $bg solid_color
output * bg ~/.config/wallpapers/moon.jpg fill $bg

# Look: minimal, thin white focus border, wide gaps, no effects
default_border pixel 1
default_floating_border pixel 1
hide_edge_borders smart
smart_gaps on
gaps inner 8

client.focused          $white $bg  $white $white $white
client.focused_inactive $mid   $bg  $gray  $mid   $mid
client.unfocused        $line  $bg  $gray  $line  $line
client.urgent           $white $white $bg  $white $white
client.background       $bg

exec gsettings set org.gnome.desktop.interface gtk-theme 'Adwaita-dark'
exec gsettings set org.gnome.desktop.interface icon-theme 'Papirus-Dark'
exec gsettings set org.gnome.desktop.interface font-name 'JetBrainsMono Nerd Font 10'
exec gsettings set org.gnome.desktop.interface color-scheme 'prefer-dark'
