# Gruvbox theme for sway
# Gruvbox
set $bg     #282828
set $bg1    #3c3836
set $bg2    #504945
set $fg     #ebdbb2
set $gray   #928374
set $yellow #fabd2f
set $red    #fb4934
set $aqua   #8ec07c

font pango:JetBrainsMono Nerd Font 10

# Wallpaper: drawn once by sway, no daemon. Others in ~/.config/wallpapers: castle, pacman, fortress-sunset, glowing-tree, city-dusk, iso-city, night-moons, moonlit-bridge, sepia-street, bamboo-moon, castle-hike, neon-diamond.jpg, neon-shibuya.jpg, retro-car.jpg, vaporwave.jpg (the last four are .jpg).
# For no image at all use: output * bg $bg solid_color
output * bg ~/.config/wallpapers/ruins.png fill $bg

# Look: boxy, thick borders, no effects
default_border pixel 2
default_floating_border pixel 2
hide_edge_borders smart
smart_gaps on
gaps inner 4

client.focused          $yellow $bg1 $fg   $aqua $yellow
client.focused_inactive $bg2    $bg  $gray $bg2  $bg2
client.unfocused        $bg1    $bg  $gray $bg1  $bg1
client.urgent           $red    $red $bg   $red  $red
client.background       $bg

exec gsettings set org.gnome.desktop.interface gtk-theme 'gruvbox-dark'
exec gsettings set org.gnome.desktop.interface icon-theme 'Papirus-Dark'
exec gsettings set org.gnome.desktop.interface font-name 'JetBrainsMono Nerd Font 10'
exec gsettings set org.gnome.desktop.interface color-scheme 'prefer-dark'
