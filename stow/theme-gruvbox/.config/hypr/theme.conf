# Gruvbox: boxy, thick borders, no effects
general {
    gaps_in = 2
    gaps_out = 4
    border_size = 2
    col.active_border = rgb(fabd2f)
    col.inactive_border = rgb(3c3836)
}
exec-once = gsettings set org.gnome.desktop.interface gtk-theme 'gruvbox-dark'
exec-once = gsettings set org.gnome.desktop.interface icon-theme 'Papirus-Dark'
exec-once = gsettings set org.gnome.desktop.interface font-name 'JetBrainsMono Nerd Font 10'
exec-once = gsettings set org.gnome.desktop.interface color-scheme 'prefer-dark'
